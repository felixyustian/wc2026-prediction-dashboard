name: Update World Cup results

# Fetches finished matches from API-Football and commits results.json.
# The commit to the production branch triggers Vercel to redeploy.

on:
  schedule:
    - cron: "0 4,8,12,16,20 * * *"   # five times daily (UTC) during the tournament
  workflow_dispatch: {}              # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest results
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/update-results.mjs

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain results.json)" ]]; then
            git config user.name  "wc-results-bot"
            git config user.email "actions@users.noreply.github.com"
            git add results.json
            git commit -m "chore: update results.json ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes to commit."
          fi
