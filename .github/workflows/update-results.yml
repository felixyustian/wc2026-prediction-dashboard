name: Update World Cup results

# Runs on a schedule during the tournament, plus manual trigger.
# Each run fetches finished matches, rewrites results.json, and commits.
# The commit to main triggers Vercel's git integration to redeploy.

on:
  schedule:
    # Several times a day in UTC to catch matches finishing across time zones.
    # Group stage runs Jun 11–27; trim or widen as you like.
    - cron: "0 4,8,12,16,20 * * *"
  workflow_dispatch: {}   # lets you run it on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest results
        env:
          FD_API_TOKEN: ${{ secrets.FD_API_TOKEN }}
          FD_COMPETITION: WC
        run: node scripts/update-results.mjs

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain results.json)" ]]; then
            git config user.name  "wc-results-bot"
            git config user.email "actions@users.noreply.github.com"
            git add results.json
            git commit -m "chore: update results.json ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes to commit."
          fi
