name: Update World Cup results

# Fetches finished matches from API-Football and commits results.json.
# The commit to the production branch triggers Vercel to redeploy.

on:
  schedule:
    - cron: "0 4,8,12,16,20 * * *"   # five times daily (UTC) during the tournament
  workflow_dispatch: {}              # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Fetch latest results
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/update-results.mjs

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update results.json"
          file_pattern: results.json
          commit_user_name: wc-results-bot
          commit_user_email: actions@users.noreply.github.com
            git commit -m "chore: update results.json ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes to commit."
          fi
