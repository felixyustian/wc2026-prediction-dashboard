name: Update World Cup results

# Keyless ESPN updaters for group results (results.json) and the knockout
# bracket (knockout.json). Commits to the production branch → Vercel redeploys.

on:
  schedule:
    - cron: "0 */3 * * *"     # every 3 hours during the tournament
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Update group results
        run: node scripts/update-results.mjs

      - name: Update knockout bracket
        run: node scripts/update-knockout.mjs

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update results + knockout"
          file_pattern: "results.json knockout.json"
          commit_user_name: wc-results-bot
          commit_user_email: actions@users.noreply.github.com
